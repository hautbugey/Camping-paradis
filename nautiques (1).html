<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activités Nautiques – Camping Paradis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#34BDEF">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-blue: #34BDEF;
            --accent-orange: #FF8C00;
            --text-dark: #333;
            --text-light: #666;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--text-dark); background: #f5f7fa; }

        /* ── TOP NAV ── */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: white;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .back-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #f0f4f8;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #555;
            flex-shrink: 0;
            text-decoration: none;
        }
        .back-btn:hover { background: #e2e8f0; }
        .nav-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* ── CONTENU ── */
        .page-header {
            text-align: center;
            padding: 28px 20px 16px;
        }
        .page-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 10px;
        }
        .page-header p {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.6;
        }

        /* ── GRILLE DE CARTES ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            padding: 16px 16px 40px;
        }
        .activity-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .activity-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.14);
        }
        .card-img {
            width: 100%;
            height: 150px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            background-color: #e8f4fb;
        }
        .card-label {
            padding: 12px 14px 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a class="back-btn" onclick="history.back(); return false;" href="index.html" aria-label="Retour">‹</a>
        <span class="nav-title">Activités Nautiques</span>
    </nav>

    <div class="page-header">
        <h1>Activités Nautiques</h1>
        <p>Lac, rivières et gorges : profitez de l'eau sous toutes ses formes autour du camping !</p>
    </div>

    <div class="cards-grid">
        <a href="baignade.html" class="activity-card">
            <div class="card-img" style="background-image: url('images/baignade.jpg');">🏖️</div>
            <div class="card-label">Baignade</div>
        </a>
        <a href="pedalo.html" class="activity-card">
            <div class="card-img" style="background-image: url('images/pedalo.jpg');">🚤</div>
            <div class="card-label">Pédalo</div>
        </a>
        <a href="canoe-paddle.html" class="activity-card">
            <div class="card-img" style="background-image: url('images/canoe.jpg');">🛶</div>
            <div class="card-label">Canoë, Paddle</div>
        </a>
        <a href="canyoning.html" class="activity-card">
            <div class="card-img" style="background-image: url('images/canyoning.jpg');">🧗</div>
            <div class="card-label">Canyoning</div>
        </a>
    </div>

    <script src="i18n.js" defer></script>
</body>
</html>
